#
# Release pipeline, triggered by v* tags: build from source, smoke test the
# amd64 container image, then push the amd64/arm64 multi-arch manifest to
# DockerHub and create a GitHub release with the distribution archives.
#
# DockerHub repository secrets are required: images are pushed to docker.io/opennms/pris
# with the workflow DOCKERHUB_TOKEN. One-time setup: the org must allow GitHub
# Actions to create packages, and the package created by the first push is
# private until its visibility is flipped to public manually.
---
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    container:
      image: opennms/antora:3.1.7-b10461
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Validate xrefs in docs
        run: make docs-check

  release:
    runs-on: ubuntu-latest
    needs: docs-check
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Derive version, image repository and build args from tag
        run: |
          {
            echo "VERSION=${GITHUB_REF_NAME#v}"
            echo "IMAGE_REPO=docker.io/opennms/pris"
            echo "BUILD_ARGS<<EOF"
            echo "OPENNMS_PRIS_VERSION=${GITHUB_REF_NAME#v}"
            echo "VERSION=${GITHUB_REF_NAME#v}"
            echo "SOURCE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "EOF"
          } >> "${GITHUB_ENV}"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and run tests
        run: make compile
      - name: Build documentation
        run: make docs-docker
      - name: Package release archives
        run: make package
      - name: Stage release archive for the container build
        run: make oci-stage
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build amd64 container image for smoke testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: docker
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_REPO }}:${{ env.VERSION }}
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container image
        run: make smoke-test IMAGE="${IMAGE_REPO}" VERSION="${VERSION}"
      - name: Push multi-arch container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.VERSION }}
            ${{ env.IMAGE_REPO }}:latest
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha
      - name: Create GitHub release with distribution archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp opennms-pris-dist/target/opennms-pris-release-archive.tar.gz "opennms-pris-release-${VERSION}.tar.gz"
          cp opennms-pris-dist/target/opennms-pris-release-archive.zip "opennms-pris-release-${VERSION}.zip"
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "opennms-pris-release-${VERSION}.tar.gz" \
            "opennms-pris-release-${VERSION}.zip"
